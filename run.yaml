# Commands run EXACTLY as written, in order, from a fresh checkout on Windows. Non-interactive.

setup_commands:
    - "python -c \"import sys; assert sys.version_info >= (3, 12), 'Python 3.12+ required'\""
    - "python -m venv .venv"
    - " .\\.venv\\Scripts\activate"
    - "python -m pip install --upgrade pip -q"
    - "python -m pip install -e \".[dev]\" -q"
    - "python -m playwright install chromium"
    - "codecast fetch-voice"
    - "codecast doctor"

run_commands:
    - "codecast.exe run --repo https://github.com/rkumar-bengaluru/video-classifier --out output/ --config config/openai.yaml"
    - "ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output\\video-classifier\\explainer.mp4"

test_commands:
    - ".python.exe -m pytest -q"

notes: "Windows. Requires ffmpeg >= 7 (winget install ffmpeg) and OPENAI_API_KEY (PowerShell: $env:OPENAI_API_KEY=\"sk-...\" ; CMD: set OPENAI_API_KEY=sk-...). config/openai.yaml selects gpt-5.4-mini, the model the committed demo was made with; drop --config to use the built-in default, Anthropic, with ANTHROPIC_API_KEY. TTS is local: piper (voice downloaded once by fetch-voice into %USERPROFILE%\\.cache\\codecast) is the primary on Windows, there is no `say` fallback. Takes about 3-5 minutes per video. The default test suite is offline and needs no API key (it uses ffmpeg and headless Chromium). The committed example output is in output\\video-classifier\\ (explainer.mp4, explainer.srt, storyboard.json, run_report.json); a successful run replaces those four files together."